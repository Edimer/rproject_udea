  // Función para crear tarjetas de recursos
  function createRecursoCard(recurso) {
    const iconMap = {
      html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>`,
      download: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>`,
      external: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>`
    };
    
    const buttonText = {
      html: "Ver Guía",
      download: "Descargar",
      external: "Abrir"
    };
    
    return `
      <div class="recurso-card">
        <div class="card-header">
          <h3 class="card-title">${recurso.title}</h3>
          ${recurso.badge ? `<span class="card-badge ${recurso.badge.toLowerCase()}">${recurso.badge}</span>` : ''}
        </div>
        
        <p class="card-description">${recurso.description}</p>
        
        <div class="card-actions">
          <a href="${recurso.link}" class="btn btn-primary" target="_blank">
            ${iconMap[recurso.type] || iconMap.external}
            ${buttonText[recurso.type] || "Abrir"}
          </a>
        </div>
      </div>
    `;
  }
  
  // Renderizar tarjetas iniciales
  function renderCards() {
    Object.keys(recursosData).forEach(categoria => {
      const grid = document.getElementById(`${categoria}-grid`);
      if (grid && recursosData[categoria]) {
        grid.innerHTML = recursosData[categoria].map(createRecursoCard).join('');
      }
    });
  }
  
  // Funcionalidad de pestañas
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      // Remover active de todos
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      
      // Agregar active al actual
      this.classList.add('active');
      const tabId = this.getAttribute('data-tab');
      document.getElementById(tabId).classList.add('active');
    });
  });
  
  // Inicializar
  renderCards();
});
